name: Deploy Hermes Agent to Raspberry Pi 5

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 拉取最新程式碼
        uses: actions/checkout@v4

      - name: 打包 Docker 鏡像與清理舊環境
        run: |
          docker build -t pi-cloud-app .
          docker stop pi-app-container || true
          docker rm -f pi-app-container || true
          docker image prune -f

      - name: 啟動 Docker 容器 (帶入 OpenRouter / MiniMax API Key)
        env:
          MINIMAX_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_URL: ${{ secrets.MINIMAX_BASE_URL }}
        run: |
          docker run -d \
            --restart always \
            --name pi-app-container \
            -p 8000:8000 \
            -e MINIMAX_API_KEY="${MINIMAX_KEY}" \
            -e MINIMAX_BASE_URL="${MINIMAX_URL}" \
            pi-cloud-app