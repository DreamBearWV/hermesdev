name: Deploy to Raspberry Pi 5
 
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 拉取最新程式碼
        uses: actions/checkout@v4

      - name: 打包並重啟 Docker 服務
        run: |
          docker build -t pi-cloud-app .
          docker stop pi-app-container || true
          docker rm pi-app-container || true
          docker run -d --name pi-app-container -p 8000:8000 pi-cloud-app